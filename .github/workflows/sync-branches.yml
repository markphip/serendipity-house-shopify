name: Synchronize Shopify branches

on:
  push:
    branches:
      - main
      - shopify-sync
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: shopify-branch-sync
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Synchronize branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main shopify-sync

          if [[ "$SOURCE" == "main" ]]; then
            TARGET="shopify-sync"
          elif [[ "$SOURCE" == "shopify-sync" ]]; then
            TARGET="main"
          else
            echo "Unsupported source branch: $SOURCE"
            exit 1
          fi

          SYNC_BRANCH="sync/${SOURCE}-to-${TARGET}"

          # If source is already incorporated into target, nothing to do.
          if git merge-base --is-ancestor \
            "origin/$SOURCE" "origin/$TARGET"; then
            echo "$SOURCE is already incorporated into $TARGET."
            exit 0
          fi

          # Don't create competing synchronization PRs.
          REVERSE_BRANCH="sync/${TARGET}-to-${SOURCE}"

          REVERSE_PR=$(gh pr list \
            --state open \
            --head "$REVERSE_BRANCH" \
            --json number \
            --jq '.[0].number // empty')

          if [[ -n "$REVERSE_PR" ]]; then
            echo "::warning::Reverse synchronization PR #$REVERSE_PR is open."
            echo "Merge or close it before synchronizing in the other direction."
            exit 0
          fi

          # Start from the current target branch.
          git switch -C "$SYNC_BRANCH" "origin/$TARGET"

          # Merge source into target without modifying either permanent branch.
          if ! git merge --no-ff --no-edit "origin/$SOURCE"; then
            git merge --abort
            echo "::error::Merge conflict between $SOURCE and $TARGET."
            echo "Manual reconciliation required."
            exit 1
          fi

          # No content changes means ancestry-only synchronization.
          # Still push the merge commit to preserve history.
          git push --force-with-lease origin "$SYNC_BRANCH"

          EXISTING=$(gh pr list \
            --base "$TARGET" \
            --head "$SYNC_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [[ -n "$EXISTING" ]]; then
            echo "Updated synchronization PR #$EXISTING."
          else
            gh pr create \
              --base "$TARGET" \
              --head "$SYNC_BRANCH" \
              --title "Sync $SOURCE into $TARGET" \
              --body "Automatically generated synchronization PR. Review before merging."
          fi