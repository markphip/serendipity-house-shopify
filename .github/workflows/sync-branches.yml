name: Synchronize Shopify branches

on:
  push:
    branches:
      - main
      - shopify-sync
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: shopify-branch-sync
  cancel-in-progress: false

jobs:
  synchronize:
    name: Synchronize branches
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Synchronize branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main shopify-sync

          MAIN="origin/main"
          SHOPIFY="origin/shopify-sync"

          # Compare actual file contents, not just commit ancestry.
          # This prevents circular synchronization PRs.
          if git diff --quiet "$MAIN" "$SHOPIFY"; then
            echo "Branches have identical contents."
            echo "No synchronization needed."
            exit 0
          fi

          # Determine synchronization direction.
          if [[ "$SOURCE" == "main" ]]; then
            TARGET="shopify-sync"
          elif [[ "$SOURCE" == "shopify-sync" ]]; then
            TARGET="main"
          else
            echo "::error::Unsupported source branch: $SOURCE"
            exit 1
          fi

          SYNC_BRANCH="sync/${SOURCE}-to-${TARGET}"
          REVERSE_BRANCH="sync/${TARGET}-to-${SOURCE}"

          echo "Source: $SOURCE"
          echo "Target: $TARGET"

          # If the source is already incorporated into the target,
          # no synchronization is necessary.
          if git merge-base --is-ancestor \
            "origin/$SOURCE" "origin/$TARGET"; then
            echo "Source is already incorporated into target."
            exit 0
          fi

          # Check for an existing reverse synchronization PR.
          REVERSE_PR=$(gh pr list \
            --state open \
            --head "$REVERSE_BRANCH" \
            --json number \
            --jq '.[0].number // empty')

          if [[ -n "$REVERSE_PR" ]]; then
            echo "Found reverse synchronization PR #$REVERSE_PR"

            REVERSE_CHANGES=$(gh pr view "$REVERSE_PR" \
              --json files \
              --jq '.files | length')

            if [[ "$REVERSE_CHANGES" -gt 0 ]]; then
              echo "::warning::Reverse synchronization PR #$REVERSE_PR has changes."
              echo "Resolve it before synchronizing in the other direction."
              exit 0
            fi

            echo "Reverse PR has no file changes. Continuing."
          fi

          # Create synchronization branch from the target.
          git switch -C "$SYNC_BRANCH" "origin/$TARGET"

          # Merge source changes while preserving both histories.
          if ! git merge --no-ff --no-edit "origin/$SOURCE"; then
            git merge --abort
            echo "::error::Merge conflict between $SOURCE and $TARGET."
            echo "Manual reconciliation required."
            exit 1
          fi

          # If merging produced no file changes relative to target,
          # no PR is needed.
          if git diff --quiet "origin/$TARGET" HEAD; then
            echo "Merge produced no content changes."
            echo "Skipping synchronization PR."
            exit 0
          fi

          # Update or create the temporary synchronization branch.
          git push --force-with-lease origin "$SYNC_BRANCH"

          EXISTING=$(gh pr list \
            --base "$TARGET" \
            --head "$SYNC_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [[ -n "$EXISTING" ]]; then
            echo "Updated synchronization PR #$EXISTING."
          else
            gh pr create \
              --base "$TARGET" \
              --head "$SYNC_BRANCH" \
              --title "Sync $SOURCE into $TARGET" \
              --body "Automatically generated synchronization PR. Review before merging."
          fi